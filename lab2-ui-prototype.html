    .form-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.panel-title{font-size:16px;font-weight:800;margin-bottom:17px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.textarea{height:104px;width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;resize:none}.upload{height:185px;border:2px dashed #d8dcf0;border-radius:13px;background:#fafbff;display:grid;place-items:center;text-align:center;color:#7c8498}.upload strong{display:block;color:#555fcf;margin-bottom:7px}.preview-item{display:flex;gap:11px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:12px}.preview-pic{width:70px;height:60px;border-radius:9px;background:#dbe6fc;display:grid;place-items:center;font-size:28px}

<body><div id="root"></div>
<script>
const productRows=[
  ['📚','高等数学第七版教材','教材书籍','¥ 22.00','已发布'],['🎧','Sony 头戴式蓝牙耳机','数码产品','¥ 268.00','已预约'],['🚲','九成新校园通勤自行车','生活用品','¥ 399.00','待审核'],['⌨️','机械键盘 87 键','数码产品','¥ 148.00','已完成']
];
const tag=s=>s==='已发布'?'<span class="tag green">已发布</span>':s==='已预约'?'<span class="tag orange">已预约</span>':s==='待审核'?'<span class="tag">待审核</span>':'<span class="tag gray">已完成</span>';
const tableRows=productRows.map((r,i)=>`<tr><td><div class="product-cell"><div class="thumb bg${i%4+1}" style="display:grid;place-items:center;font-size:24px">${r[0]}</div><div><b>${r[1]}</b><div class="muted">SP2026110${i+1}</div></div></div></td><td>${r[2]}</td><td><b>${r[3]}</b></td><td>${tag(r[4])}</td><td>2026-11-0${5-i}</td><td><button class="btn ghost small">查看</button></td></tr>`).join('');
function brand(){return `<div class="brand"><span class="brand-mark">拾</span><span>拾光集市</span></div>`}
function browser(title){return `<div class="browser"><div class="dots"><i class="dot red"></i><i class="dot yellow"></i><i class="dot green"></i></div><div class="address">🔒 campus-market.local · ${title}</div><span>☆</span><span>⋮</span></div>`}
function side(active,admin=false){let normal=[['⌂','工作台'],['▦','商品管理'],['♧','预约与交易'],['♢','站内通知'],['◎','个人资料']];let adm=[['⌂','管理概览'],['✓','商品审核'],['⚑','举报与治理'],['◉','用户管理'],['▤','分类管理'],['▥','操作日志']];let list=admin?adm:normal;return `<aside class="sidebar">${brand()}<div class="side-section">${admin?'平台管理':'个人中心'}</div>${list.map(x=>`<div class="side-item ${x[1]===active?'active':''}"><span class="side-icon">${x[0]}</span>${x[1]}</div>`).join('')}<div class="side-footer"><div class="avatar ${admin?'admin':''}">${admin?'管':'李'}</div><div><b>${admin?'平台管理员':'李同学'}</b><br><span style="color:#858da8">${admin?'ADMIN':'普通用户'}</span></div></div></aside>`}
function shell(title,subtitle,active,content,admin=false,actions=''){return `${browser(title)}<div class="shell">${side(active,admin)}<main class="main"><div class="topbar"><span class="crumb">拾光集市 / ${title}</span><div class="top-actions"><div class="bell">♢</div><div class="avatar ${admin?'admin':''}">${admin?'管':'李'}</div><b style="font-size:13px">${admin?'平台管理员':'李同学'}</b></div></div><section class="content"><div class="page-head"><div><h1>${title}</h1><p>${subtitle}</p></div><div class="page-actions">${actions}</div></div>${content}</section></main></div>`}
function publicNav(active='首页'){return `<div class="public-nav">${brand()}<div class="nav-links"><span class="${active==='首页'?'active':''}">首页</span><span class="${active==='分类'?'active':''}">全部分类</span><span>交易规则</span><span>安全指南</span></div><div class="nav-actions"><button class="btn ghost">登录</button><button class="btn">免费发布</button></div></div>`}
const screens={
