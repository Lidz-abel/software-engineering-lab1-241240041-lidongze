[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shiguang-market"
version = "1.0.0"
description = "Campus second-hand marketplace desktop prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shiguang = "market.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.main]
ignore = ["build", "dist"]

[tool.pylint.messages_control]
disable = ["too-few-public-methods", "too-many-instance-attributes", "too-many-public-methods", "too-many-arguments", "too-many-positional-arguments", "too-many-locals", "too-many-lines", "duplicate-code"]

[tool.pylint.format]
max-line-length = 100
